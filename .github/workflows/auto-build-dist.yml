name: Auto-Build dist/

on:
  push:
    branches-ignore: [ main ]
    paths:
      - 'src/**'
      - 'package.json'
      - 'tsconfig.json'
      - '.github/workflows/auto-build-dist.yml'

  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'package.json'
      - 'tsconfig.json'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm ci
      - run: npm run build

      - name: Commit dist/ if changed
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/
          if ! git diff --cached --quiet; then
            git commit -m "chore(build): auto-update dist/ [skip ci]"
            git push origin ${{ github.ref_name }}
            echo "Pushed updated dist/"
          else
            echo "dist/ is already up-to-date"
          fi

      - name: Verify dist/ in PR
        if: github.event_name == 'pull_request'
        run: |
          npm run build
          if git diff --quiet dist/; then
            echo "dist/ matches source code"
          else
            echo "dist/ is outdated! Please run 'npm run build' locally and commit dist/, or push to your branch to trigger auto-build."
            git diff dist/
            exit 1
          fi
